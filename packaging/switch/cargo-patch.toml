# The crates the Switch build patches (docs/switch.md). Pass it from the repository root:
#   cargo build --config packaging/switch/cargo-patch.toml --target aarch64-nintendo-horizon.json ...
# The patches only act on `target_os = "horizon"`, so the copies in third_party/ behave like the
# originals on every other platform. wgpu-hal is patched for everyone in the root Cargo.toml.
# Paths are relative to packaging/, the parent of this folder (cargo's rule for config files).
[patch.crates-io]
wgpu = { path = "../third_party/wgpu" }
wgpu-core = { path = "../third_party/wgpu-core" }
wgpu-core-deps-windows-linux-android = { path = "../third_party/wgpu-core-deps-windows-linux-android" }
getrandom03 = { path = "../third_party/getrandom-0.3", package = "getrandom" }
winit = { path = "../third_party/winit" }
# socket2 0.5.10 without the calls libnx's sockets lack; its Horizon code is inert elsewhere.
socket2 = { path = "../third_party/socket2" }
# Stand-ins with the few calls the game makes, for crates whose Unix code needs what Horizon's
# newlib lacks (X11/Wayland, getifaddrs): packaging/switch/stubs/.
arboard = { path = "switch/stubs/arboard" }
if-addrs = { path = "switch/stubs/if-addrs" }
# mimalloc needs mmap, which libnx lacks: stand-ins over the system heap, which horizon-nx backs with
# its TLSF heap. This file's patch wins over the root Cargo.toml's libmimalloc-sys one.
mimalloc = { path = "switch/stubs/mimalloc" }
libmimalloc-sys = { path = "switch/stubs/libmimalloc-sys" }
# fs4's flock and statvfs aren't in newlib: the space queries answer "unknown".
fs4 = { path = "switch/stubs/fs4" }
# mio with the Switch's poll flag type (its Horizon code is the 3DS's): third_party/mio/HORIZON.md.
mio = { path = "../third_party/mio" }

# `-z notext`, as bevy-horizon's examples pass from their build.rs (text relocations are kept).
[target.aarch64-nintendo-horizon]
rustflags = ["-C", "link-arg=-z", "-C", "link-arg=notext"]
